# ***************** AIris-MachineLearning Project ***********************
# ****** Backend Deployment Configuration for FastAPI Application ******
#
# Backend deployment for AIris REST API (FastAPI application)
# Elements to deploy:
# 1. Firewall:
#    - airis-backend-firewall
#    - airis-frontend-firewall
# 2. Instance:
#    - airis-api-instance
#    - airis-api-instance



resources:
# ===========================================================
# firewall rules

# firewall rule kong
- name: api-gateway
  type: compute.v1.firewall
  properties:
    network: https://www.googleapis.com/compute/v1/projects/<id-proyecto>/global/networks/default
    priority: 1000
    direction: INGRESS
    sourceRanges: 
    - 0.0.0.0/0
    targetTags:
    - api-gateway
    allowed:
    - IPProtocol: TCP
      ports: 
      - 8000
      - 8080


# Firewall rule for frontend
- name: airis-frontend-firewall
  type: compute.v1.firewall
  properties:
    network: https://www.googleapis.com/compute/v1/projects/<id-proyecto>/global/networks/default
    priority: 1000
    direction: INGRESS
    sourceRanges: 
    - 0.0.0.0/0
    targetTags:
    - airis-frontend
    allowed:
    - IPProtocol: TCP
      ports: 
      - 80
      - 443
      - 3000
      - 8080

# Firewall rule for backend
- name: airis-backend-firewall
  type: compute.v1.firewall
  properties:
    network: https://www.googleapis.com/compute/v1/projects/<id-proyecto>/global/networks/default
    priority: 1000
    direction: INGRESS
    sourceTags: 
    - airis-frontend
    targetTags:
    - airis-backend
    allowed:
    - IPProtocol: TCP
      ports: 
      - 8000 
      - 8080
# ===========================================================
# Router y NAT
- name: cbd-router
  type: compute.v1.router
  properties:
    region: us-central1
    network: https://www.googleapis.com/compute/v1/projects/finalproject-457723/global/networks/default
    nats:
    - name: cbd-nat
      natIpAllocateOption: AUTO_ONLY
      sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES


# ===========================================================

# Kong instance
- name: kong-instance
  type: compute.v1.instance
  properties:
    zone: us-central1-a
    machineType: https://www.googleapis.com/compute/v1/projects/<id-proyecto>/zones/us-central1-a/machineTypes/e2-micro
    disks:
    - deviceName: boot
      type: PERSISTENT
      boot: true
      autoDelete: true
      initializeParams:
        sourceImage: https://www.googleapis.com/compute/v1/projects/cos-cloud/global/images/cos-101-17162-463-8
    networkInterfaces:
    - network: https://www.googleapis.com/compute/v1/projects/<id-proyecto>/global/networks/default
      networkIP: 10.128.0.81
      accessConfigs:
      - name: External NAT
        type: ONE_TO_ONE_NAT
    tags:
      items: 
      - api-gateway
    metadata:
      items:
      - key: startup-script
        value: |
          #!/bin/bash
          sudo mkdir /home/labs
          cd /home/labs
          sudo git clone https://github.com/aarevalom0/AIris-MachineLearning.git
          cd AIris-MachineLearning
          docker network create kong-net
          docker run -d --name kong --network=kong-net --restart=always \
          -v "$(pwd):/kong/declarative/" -e "KONG_DATABASE=off" \
          -e "KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yaml" \
          -p 8000:8000 kong/kong-gateway

# ===========================================================
# React Frontend instance
- type: compute.v1.instance
  name: airis-web-instance1
  properties:
    zone: us-central1-a
    machineType: https://www.googleapis.com/compute/v1/projects/<id-proyecto>/zones/us-central1-a/machineTypes/e2-medium
    disks:
    - deviceName: boot
      type: PERSISTENT
      boot: true
      autoDelete: true
      initializeParams:
        sourceImage: https://www.googleapis.com/compute/v1/projects/ubuntu-os-cloud/global/images/ubuntu-2004-focal-v20240307b
    networkInterfaces:
    - network: https://www.googleapis.com/compute/v1/projects/<id-proyecto>/global/networks/default
      networkIP: 10.128.0.85
      accessConfigs:
      - name: External NAT
        type: ONE_TO_ONE_NAT
    tags:
      items: 
      - airis-frontend
    metadata:
      items:
      - key: startup-script
        value: |
          #!/bin/bash
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git curl
          git clone https://github.com/aarevalom0/AIris-MachineLearning.git
          cd AIris-MachineLearning/Front/ai-ris-website/
          make build
  
          

